<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="nav" id="nav"></header>
<main class="wrap"><h2>Your cart</h2><div class="box" id="items"></div>
<div class="box" id="sum"></div>
<form class="box" id="co" hidden><h3>Delivery details</h3><br><div class="two"><input id="n" placeholder="Name" required><input id="p" placeholder="Phone" required></div><br>
<input id="a" placeholder="Delivery address" required><br><br><div class="two"><input id="c" placeholder="City" required><input id="z" placeholder="Pincode" required></div><br>
<input id="cp" placeholder="Coupon code (optional)"><br><br><label><input type="radio" name="pm" value="COD" checked style="width:auto"> Cash on delivery</label><br><br>
<button class="btn dark">Place order</button></form></main>
<script src="/js/app.js"></script><script>
function draw(){const c=cart.get();$('#co').hidden=!c.length;
 $('#items').innerHTML=c.length?c.map((i,x)=>`<div class="row-between"><span>${i.name}</span><span class="qty"><button onclick="q(${x},-1)" aria-label="Decrease">−</button>${i.qty}<button onclick="q(${x},1)" aria-label="Increase">+</button></span><b>${money(i.price*i.qty)}</b><button class="btn sm ghost" onclick="q(${x},-99)">Remove</button></div>`).join('')+`<br><button class="btn sm ghost" onclick="cart.set([]);draw()">Clear cart</button>`:'<p class="empty">Your cart is empty. <a href="/"><u>Browse the menu</u></a></p>';
 const s=c.reduce((a,i)=>a+i.price*i.qty,0),t=s*.05;$('#sum').hidden=!c.length;
 $('#sum').innerHTML=`<div class="row-between">Subtotal<b>${money(s)}</b></div><div class="row-between">Delivery<b>${money(40)}</b></div><div class="row-between">Tax (5%)<b>${money(t)}</b></div><div class="row-between"><b>Total</b><b>${money(s+40+t)}</b></div>`}
function q(i,d){const c=cart.get();c[i].qty+=d;cart.set(c.filter(x=>x.qty>0));draw()}
$('#co').onsubmit=async e=>{e.preventDefault();if(!user())return location.href='/login.html';
 try{const o=await api('/orders',{method:'POST',body:{items:cart.get(),coupon:$('#cp').value,paymentMethod:'COD',address:{name:$('#n').value,phone:$('#p').value,line:$('#a').value,city:$('#c').value,pincode:$('#z').value}}});
 cart.set([]);location.href='/orders.html'}catch(x){toast(x.message)}};draw();
</script></body></html>
