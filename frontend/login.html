<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="nav" id="nav"></header>
<form class="form box" id="f"><h2 id="h">Log in</h2>
<input id="name" placeholder="Full name" hidden><input id="phone" placeholder="Phone number" hidden>
<input id="email" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password" required minlength="6">
<input id="pw2" type="password" placeholder="Confirm password" hidden>
<button class="btn dark" id="go">Log in</button><a href="#" id="sw">New here? Create an account</a></form>
<script src="/js/app.js"></script><script>
let reg=false;$('#sw').onclick=e=>{e.preventDefault();reg=!reg;['name','phone','pw2'].forEach(i=>$('#'+i).hidden=!reg);
 $('#h').textContent=$('#go').textContent=reg?'Create account':'Log in';$('#sw').textContent=reg?'Have an account? Log in':'New here? Create an account'};
$('#f').onsubmit=async e=>{e.preventDefault();if(reg&&$('#pw').value!==$('#pw2').value)return toast('Passwords do not match');
 try{const d=await api('/auth/'+(reg?'register':'login'),{method:'POST',body:{name:$('#name').value,phone:$('#phone').value,email:$('#email').value,password:$('#pw').value}});
 localStorage.token=d.token;localStorage.user=JSON.stringify(d.user);location.href=d.user.role==='admin'?'/admin/dashboard.html':'/'}catch(x){toast(x.message)}};
</script></body></html>
